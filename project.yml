# Xcode project definition (D-12).
#
# Itchy.xcodeproj is generated from this file and is never committed: a pbxproj
# is opaque, merge-hostile, and reviewable only by running it. This file is the
# source of truth for the app target, and `make project` regenerates from it.
#
# Info.plist is generated from the properties below rather than hand-maintained,
# so that the bundle identifier, the deployment floor and LSUIElement have one
# definition each.

name: Itchy

options:
  bundleIdPrefix: com.wdogsystems
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # CODE_SIGN_IDENTITY is deliberately absent here. A project-level value
    # overrides an xcconfig, which would defeat Config/Debug.xcconfig and leave
    # every build ad-hoc — and TCC re-prompting on each one. Debug takes it from
    # the config file; Release sets it below and `make release` overrides that
    # with the Developer ID (NFR-4.2).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_ENTITLEMENTS: App/Itchy.entitlements
    ENABLE_USER_SCRIPT_SANDBOXING: NO

  configs:
    Release:
      # Ad-hoc by default so a clone builds without a certificate; `make release`
      # overrides it with the Developer ID.
      CODE_SIGN_IDENTITY: "-"
      # Required for notarisation, and compatible with running unsandboxed
      # (NFR-4.2, CON-6).
      ENABLE_HARDENED_RUNTIME: YES

# Debug signing is indirected through Config/Debug.xcconfig so that an ad-hoc
# build still works everywhere, while `make sign-setup` gives this machine a
# stable identity — which is what stops TCC asking for automation permission on
# every rebuild.
configFiles:
  Debug: Config/Debug.xcconfig

packages:
  ItchyCore:
    path: Packages/ItchyCore
  ItchyServices:
    path: Packages/ItchyServices

targets:
  Itchy:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ItchyCore
        product: ItchyCore
      - package: ItchyServices
        product: ItchyServices
    info:
      path: App/Info.plist
      properties:
        # Accessory application: no Dock icon, no application window (FR-1.1).
        LSUIElement: true
        CFBundleName: Itchy
        CFBundleDisplayName: Itchy
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 Tim Howland. All rights reserved.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wdogsystems.itchy
        PRODUCT_NAME: Itchy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ItchyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ItchyTests
    dependencies:
      - target: Itchy
    settings:
      base:
        # Test bundles need a plist to be signed; there is nothing worth
        # hand-maintaining in one, so Xcode generates it.
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Itchy.app/Contents/MacOS/Itchy

  ItchyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/ItchyUITests
    dependencies:
      - target: Itchy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Itchy

schemes:
  Itchy:
    build:
      targets:
        Itchy: all
        ItchyTests: [test]
        ItchyUITests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - Itchy
      targets:
        - ItchyTests
        - ItchyUITests
    run:
      config: Debug
